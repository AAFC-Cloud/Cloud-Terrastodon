[package]
name = "cloud_terrastodon_ui_egui"
description = "User interface for the Cloud Terrastodon project leveraging egui"
version = "0.38.0" # CT_VERSION
readme.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
teamy-tracing = { workspace = true, features = ["egui"] }
cloud_terrastodon_app.workspace = true
cloud_terrastodon_auth.workspace = true
cloud_terrastodon_auth_cli.workspace = true
cloud_terrastodon_execution.workspace = true
cloud_terrastodon_azure_devops.workspace = true
cloud_terrastodon_azure_devops_cli.workspace = true
cloud_terrastodon_azure.workspace = true
cloud_terrastodon_azure_cli.workspace = true
cloud_terrastodon_cache.workspace = true
cloud_terrastodon_command.workspace = true
cloud_terrastodon_cli_types.workspace = true
cloud_terrastodon_config.workspace = true
cloud_terrastodon_auth_types.workspace = true
cloud_terrastodon_hcl.workspace = true
cloud_terrastodon_iconography.workspace = true
cloud_terrastodon_iconography_azure = { workspace = true, features = ["all", "resource-types"] }
cloud_terrastodon_pathing.workspace = true
cloud_terrastodon_user_input.workspace = true
cloud_terrastodon_zombies.workspace = true
chrono.workspace = true
crossterm.workspace = true
eframe.workspace = true
egui_extras = { workspace = true, features = ["svg"] }

egui-toast.workspace = true
eyre.workspace = true
facet.workspace = true
facet-json.workspace = true
facet-reflect.workspace = true
figue.workspace = true
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
indexmap.workspace = true
itertools.workspace = true
strip-ansi-escapes.workspace = true
tokio.workspace = true
teamy-cancellation.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
async-trait.workspace = true

[lints]
workspace = true
