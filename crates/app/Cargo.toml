[package]
name = "cloud_terrastodon_app"
description = "Reusable startup and global arguments for consumer-owned Cloud Terrastodon CLIs"
version = "0.36.0" # CT_VERSION
readme = "README.md"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
cloud_terrastodon_tracing.workspace = true
cloud_terrastodon_credentials = { workspace = true, optional = true }
cloud_terrastodon_user_input = { workspace = true, optional = true }
facet.workspace = true
figue.workspace = true
eyre.workspace = true
color-eyre.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
teamy-cancellation.workspace = true
arbitrary = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Console", "Win32_Globalization"] }

[features]
default = []
auth = ["dep:cloud_terrastodon_credentials"]
terminal = ["dep:cloud_terrastodon_user_input"]
arbitrary = ["dep:arbitrary"]
extended_observability = [
    "cloud_terrastodon_tracing/extended_observability",
    "cloud_terrastodon_user_input?/extended_observability",
]
terminal_coordinator_debug = ["terminal", "cloud_terrastodon_user_input/terminal_coordinator_debug"]
tracy = ["cloud_terrastodon_tracing/tracy", "extended_observability"]
