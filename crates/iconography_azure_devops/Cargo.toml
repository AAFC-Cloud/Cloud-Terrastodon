[package]
name = "cloud_terrastodon_iconography_azure_devops"
description = "Category-gated embedded Azure DevOps SVG icons"
version = "0.37.0" # CT_VERSION
readme = "README.md"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
cloud_terrastodon_iconography.workspace = true
facet = { workspace = true, optional = true }
arbitrary = { workspace = true, optional = true }
eyre = { workspace = true, optional = true }
linkme = { workspace = true, optional = true }

[features]
# @generated by iconography-cli generate; categories come from catalogue.json.
default = []
all = ["boards", "repos"]
boards = []
repos = []
registry = ["cloud_terrastodon_iconography/registry", "dep:facet", "dep:arbitrary", "dep:eyre", "dep:linkme"]

[package.metadata.docs.rs]
all-features = true
