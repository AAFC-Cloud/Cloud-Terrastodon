[package]
name = "cloud-terrastodon-standalone-cli"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "field-notes"
path = "src/main.rs"

[dependencies]
cloud_terrastodon = { path = "../..", version = "=0.37.0", default-features = false, features = ["app-auth", "azure"] }
# Figue's attribute expansion currently requires ::facet in the extern prelude.
# Keep the canonical Rust alias for TeamDman's distinct published package.
facet.workspace = true

[dev-dependencies]
arbitrary.workspace = true
cloud_terrastodon_app = { workspace = true, features = ["arbitrary"] }

[lints]
workspace = true
